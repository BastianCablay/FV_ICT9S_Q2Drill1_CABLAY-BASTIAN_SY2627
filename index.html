<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<style>
    
    .row{background-color: #FFFFFF;
       border-radius: 5px;
       text-align: center;
       padding: 10px;
       margin: 20px;
       box-shadow: 3px 8px 20px black;
       }

    h2{background-color: lightsalmon;
       border-radius: 5px;
       text-align: center;
       margin: 10px;
       }
    
    .col{ 
        background-color: #FFFFFF;
        border-radius: 5px;
        box-shadow: 3px 8px 20px black
        }
    
    ul{padding-left: 10px;
      }
   
    body{
        background-image: url(https://cdn.phototourl.com/member/2026-10-09-1c7e47ac-5248-402e-8152-01b1592d92b1.png);
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        }
</style>

<body>
    <div class="container">

        <div class="row">
            <h1>🏀Basketball</h1>
        </div>

        <br>
            <img src="https://png.pngtree.com/png-vector/20190120/ourmid/pngtree-basketball-hand-painted-ball-motion-png-image_483157.png" style="margin: auto; display: block; width: 250px; height: 250px;" alt="Basketball" id="Basket">
        <br>

        <div class="row gap-3">
            <div class="col">
                <h2>Basic rules</h2>
                <ul>
                    <li>No double dribbling</li>
                    <li>No travelling</li>
                    <li>Backcourt rule</li>
                </ul>
            </div>

            <div class="col">
                <ul>
                    <h2>Basic moves</h2>
                    <li>Spin move</li>
                    <li>Eurostep</li>
                    <li>Layup</li>
                </ul>
            </div>
            
            <div class="col">
                <h2>Basic Equipment</h2>
                    <ul>
                    <li>Basketball</li>
                    <li>Basketball Shorts and Shirt</li>
                    <li>Ankle braces</li>
                    <li>Goggles (optional)</li>
                </ul>
            </div>
        </div>
    </div>

</body>
</html>
